<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Romantic Page ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top, #1a0026, #000000);
    overflow:hidden;
    color:white;
}

/* ⭐ Bintang */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{ opacity:0.2; }
    to{ opacity:1; }
}

/* 💖 Card */
.card{
    position:relative;
    padding:60px 80px;
    text-align:center;
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius:30px;
    box-shadow:0 0 60px rgba(255,0,150,0.5);
    z-index:10;
    animation: fadeIn 2s ease-in-out;
}

h1{
    font-size:55px;
    color:#ff4da6;
    text-shadow:0 0 15px #ff4da6,
                0 0 30px #ff1493,
                0 0 60px #ff0055;
    animation: glow 2s infinite alternate;
}

p{
    margin-top:15px;
    font-size:20px;
    letter-spacing:3px;
    opacity:0.8;
}

/* 💞 Love besar berputar */
.big-heart{
    position:absolute;
    font-size:150px;
    color:#ff1a75;
    animation: rotate 8s linear infinite;
    filter: drop-shadow(0 0 20px #ff0055);
}

@keyframes rotate{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
}

/* 💕 Love jatuh */
.love{
    position:absolute;
    color:#ff4da6;
    font-size:20px;
    animation: fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-10vh);
        opacity:1;
    }
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

/* ✨ Glow */
@keyframes glow{
    from{ transform: scale(1); }
    to{ transform: scale(1.08); }
}

@keyframes fadeIn{
    from{ opacity:0; transform:translateY(40px); }
    to{ opacity:1; transform:translateY(0); }
}

/* 💌 Tombol */
button{
    margin-top:25px;
    padding:12px 30px;
    border:none;
    border-radius:25px;
    background:linear-gradient(45deg,#ff0066,#ff4da6);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px #ff0066;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 40px #ff4da6;
}

.hidden-message{
    margin-top:20px;
    font-size:18px;
    opacity:0;
    transition:0.5s;
}
.show{
    opacity:1;
}
</style>
</head>

<body>

<!-- 💖 Love besar -->
<div class="big-heart">❤</div>

<!-- 💌 Card -->
<div class="card">
    <h1>I Love You ❤️</h1>
    <p>Forever & Always</p>
    <button onclick="openHeart()">Open My Heart 💌</button>
    <div class="hidden-message" id="message">
        You are the most beautiful part of my life 💖✨
    </div>
</div>

<!-- 🎵 Musik -->
<audio id="music" loop>
    <source src="https://files.catbox.moe/3zi2bu.mp3"
    type="audio/mpeg">
</audio>

<script>
function openHeart(){
    document.getElementById("message").classList.toggle("show");

    let music = document.getElementById("music");
    music.play().catch(function(error){
        console.log("Autoplay diblokir:", error);
    });
}

/* ⭐ Generate bintang */
for(let i=0;i<60;i++){
    let star=document.createElement("div");
    star.className="star";
    star.style.top=Math.random()*100+"vh";
    star.style.left=Math.random()*100+"vw";
    star.style.animationDuration=(Math.random()*3+1)+"s";
    document.body.appendChild(star);
}

/* 💕 Generate love jatuh */
for(let i=0;i<25;i++){
    let love=document.createElement("div");
    love.className="love";
    love.innerHTML="❤";
    love.style.left=Math.random()*100+"vw";
    love.style.animationDuration=(Math.random()*5+5)+"s";
    document.body.appendChild(love);
}
</script>

</body>
</html>
